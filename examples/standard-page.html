<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2BEA Design System Standard Page</title>
  <link rel="stylesheet" href="../b2bea.css">
</head>
<body data-register="public_standard">
  <main class="b2bea-page">
    <header class="b2bea-page-hero">
      <div class="b2bea-page-hero__inner">
        <img class="b2bea-logo b2bea-logo--horizontal" src="../logos/horizontal/gray-white.png" alt="B2BEA">
        <h1>Vendor Directory</h1>
        <p>Find B2B ecommerce partners using consistent filters, cards, pills, and page structure.</p>
      </div>
    </header>

    <section class="b2bea-section">
      <div class="b2bea-container">
        <div class="b2bea-panel">
          <label for="search">Search vendors</label>
          <input id="search" class="b2bea-search" type="search" placeholder="Search by name, category, or service">
        </div>

        <p>
          <span class="b2bea-pill b2bea-pill--active">All</span>
          <span class="b2bea-pill">Commerce</span>
          <span class="b2bea-pill">ERP</span>
          <span class="b2bea-pill">Implementation</span>
        </p>

        <article class="b2bea-card b2bea-panel">
          <span class="b2bea-badge">Featured</span>
          <h2>Standard card</h2>
          <p>Cards use one border, a 12px radius, white background, and restrained elevation.</p>
          <a class="b2bea-button b2bea-button--primary" href="#">View profile</a>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
